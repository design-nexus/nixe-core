name: Standalone check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    steps:
      - name: Prepare Git checkout
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Publication prerequisite
        run: |
          if grep -R 'file://' --include='Cargo.toml' .; then
            echo 'Local pilot: replace dependencies before enabling hosted CI.'
            exit 1
          fi
      - name: Build prerequisites
        run: bash tools/ci-bootstrap.sh
      - run: cargo check --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: EDS calendar tests (private session bus)
        run: |
          useradd -m builder && chown -R builder: .
          su builder -c 'tools/test-eds.sh'
